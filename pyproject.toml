[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aireview"
version = "0.1.0"
description = "Plain-language review of what your AI pair-programmer just changed in your git repo — with risk flags for deletions, secrets, config and dependency changes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nguyen Dang Khoa" }
]
keywords = ["ai", "code-review", "git", "diff", "vibe-coding", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/ngdangkhoa-dev/aireview"

[project.scripts]
aireview = "aireview.cli:main"

[tool.setuptools.packages.find]
include = ["aireview*"]
